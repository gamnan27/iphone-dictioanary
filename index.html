<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Polyglot Studio</title>

<!-- iOS Home Screen Web App Meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Polyglot">

<!-- Android / Chrome PWA Meta -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Polyglot">
<meta name="theme-color" content="#e51937">
<meta name="format-detection" content="telephone=no">

<link id="apple-icon" rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link id="app-icon" rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link id="app-manifest" rel="manifest" href="manifest.json">

<style>
:root{
  color-scheme:light;
  --bg:#ffffff;
  --surf:#ffffff;
  --surf-2:#f7f8fa;
  --tx:#3c3c3c;
  --tx-dark:#18181b;
  --mu:#6b7280;
  --ac:#e51937;
  --ac-dark:#b81028;
  --ac-light:#fff1f3;
  --ac-border:#fecdd3;
  --bd:#e5e7eb;
  --bd-dark:#d1d5db;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Nunito","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}
html{
  margin:0;padding:0;width:100%;min-height:100%;
  background:var(--bg);
}
body{
  margin:0;padding:0;width:100%;min-height:100dvh;
  overflow-x:hidden;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:var(--bg);color:var(--tx);
  font-family:var(--font);
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));
}
svg.ico{
  width:17px;height:17px;flex:none;
  stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  vertical-align:middle;
}
.nav-tab svg.ico{width:20px;height:20px}

/* Top Sticky Header */
.duo-top{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1.5px solid var(--bd);
  padding:8px 12px;
}
.duo-top-in{
  max-width:680px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.duo-hud-stats{
  display:flex;align-items:center;gap:6px;
  font-weight:800;font-size:13px;flex-shrink:0;
}
.hud-item{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--ac-light);color:var(--ac);
  border:1.5px solid var(--ac-border);
  border-radius:10px;padding:5px 8px;
  font-size:12px;font-weight:800;white-space:nowrap;
}

/* Main Layout Container */
.w{
  width:100%;max-width:680px;
  margin:0 auto;padding:12px 12px 28px;
}

/* Base Tactile Button */
button{
  font:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:#ffffff;color:var(--tx-dark);
  border:1.5px solid var(--bd);border-bottom-width:3px;
  border-radius:14px;padding:10px 14px;
  font-size:14px;font-weight:800;line-height:1.2;
  min-height:42px;
  touch-action:pan-x pan-y;
  transition:transform .06s ease,background .12s ease,border-color .12s ease;
}
button:hover:not(:disabled){background:var(--surf-2);border-color:var(--bd-dark)}
button:active:not(:disabled){transform:translateY(1.5px);border-bottom-width:1.5px}
button:disabled{opacity:.45;cursor:not-allowed}

button.primary,button.on{
  background:var(--ac);color:#ffffff;
  border-color:var(--ac-dark);
}
button.primary:hover:not(:disabled),button.on:hover:not(:disabled){
  background:#d61532;border-color:var(--ac-dark);
}
button.outline-red{
  background:#ffffff;color:var(--ac);
  border-color:var(--ac-border);
}
button.outline-red:hover:not(:disabled){background:var(--ac-light);border-color:var(--ac)}
button.sm{
  font-size:12.5px;padding:6px 10px;
  border-radius:11px;border-bottom-width:2.5px;min-height:34px;
}

.duo-lang-pill{
  padding:6px 10px;border-radius:12px;min-height:36px;
  font-size:13px;white-space:nowrap;
}
.swap-btn{
  padding:6px 9px;border-radius:12px;min-height:36px;min-width:36px;
}

/* Bottom Navigation Bar */
.duo-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:rgba(255,255,255,0.98);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1.5px solid var(--bd);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
}
.duo-nav-in{
  max-width:680px;margin:0 auto;
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;
}
.nav-tab{
  border:1.5px solid transparent;border-bottom-width:1.5px;
  background:transparent;color:var(--mu);
  border-radius:12px;padding:6px 2px;min-height:50px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;
}
.nav-tab .ic{display:flex;align-items:center;justify-content:center;height:21px}
.nav-tab:hover{background:var(--surf-2);border-color:transparent}
.nav-tab.on{
  background:var(--ac-light);color:var(--ac);border-color:var(--ac-border);
}

/* Level Selector Grid */
.lvl-bar{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px;
}
.lvl-btn{
  flex-direction:column;gap:2px;
  padding:8px 6px;min-height:50px;border-radius:14px;
  background:#ffffff;border:1.5px solid var(--bd);border-bottom-width:3px;
}
.lvl-btn.on{background:var(--ac-light);border-color:var(--ac);color:var(--ac)}
.lvl-btn b{display:block;font-size:13px;line-height:1.2}
.lvl-btn span{display:block;font-size:11px;font-weight:700;opacity:.8}

/* Category Filter Chips */
.cats{
  display:flex;gap:6px;overflow-x:auto;
  padding:2px 0 8px;margin-bottom:10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.cats::-webkit-scrollbar{display:none}
.cat-chip{
  flex:0 0 auto;white-space:nowrap;
  border-radius:999px;padding:6px 13px;
  font-size:12.5px;font-weight:800;min-height:34px;
  background:#ffffff;border:1.5px solid var(--bd);border-bottom-width:2.5px;color:var(--tx);
}
.cat-chip.on{background:var(--ac);color:#ffffff;border-color:var(--ac-dark)}

/* Flashcard & Practice Cards */
.duo-card{
  background:#ffffff;
  border:1.5px solid var(--bd);border-bottom-width:4px;
  border-radius:20px;padding:22px 16px;
  text-align:center;min-height:210px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;
  cursor:pointer;word-break:break-word;
}
.duo-card:hover{border-color:var(--ac-border)}
.big-word{font-size:28px;font-weight:900;color:var(--tx-dark);line-height:1.25}
.pron-pill{
  background:var(--ac-light);color:var(--ac);
  border:1.5px solid var(--ac-border);
  border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;
}
.hint{color:var(--mu);font-size:12.5px;font-weight:700;line-height:1.4}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;min-width:0}

/* Multi-Language Bridge Pills */
.bridge-grid{
  display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:6px;width:100%;
}
.bridge-pill{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--surf-2);border:1.5px solid var(--bd);
  border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:800;color:var(--tx-dark);
  cursor:pointer;
}
.bridge-pill:active{background:var(--ac-light);border-color:var(--ac)}

/* Progress Bar */
.duo-prog{
  height:12px;background:var(--bd);border-radius:999px;overflow:hidden;margin:8px 0 12px;
}
.duo-prog i{
  display:block;height:100%;background:var(--ac);border-radius:999px;transition:width .25s ease;
}

/* Inputs & Boxes */
.box{
  background:#ffffff;border:1.5px solid var(--bd);border-bottom-width:3px;
  border-radius:18px;padding:14px;margin-bottom:12px;
}
input,textarea,select{
  width:100%;font:inherit;font-size:16px !important;font-weight:700;
  padding:11px 13px;border-radius:12px;
  border:1.5px solid var(--bd);background:var(--surf-2);color:var(--tx-dark);
  margin-top:8px;outline:none;-webkit-user-select:text;user-select:text;
}
input:focus,textarea:focus,select:focus{border-color:var(--ac);background:#ffffff}
.text-quiz-input{
  font-size:19px !important;font-weight:800;text-align:center;
  padding:13px 14px;border-radius:16px;
  border:1.5px solid var(--ac-border);border-bottom-width:3px;
  background:#ffffff;margin-top:10px;
}
.fb-sheet{
  margin-top:10px;padding:12px 14px;border-radius:16px;
  border:1.5px solid var(--ac);background:var(--ac-light);color:var(--tx-dark);
}
.fb-sheet.wrong{border-color:var(--bd-dark);background:var(--surf-2)}

.stat-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1.5px solid var(--surf-2);font-size:14px;
}
.stat-row:last-child{border-bottom:none}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;
  background:var(--ac-light);color:var(--ac);border:1.5px solid var(--ac-border);
  white-space:nowrap;
}
.badge.neutral{background:var(--surf-2);color:var(--mu);border-color:var(--bd)}

/* Interactive Number Converter Box */
.num-lab{
  background:var(--surf-2);border:1.5px solid var(--bd);
  border-radius:16px;padding:12px;margin-bottom:12px;
}
.num-presets{
  display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;
}

/* Guide Cards & Dialogue Theater */
.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.guide-card{
  background:#ffffff;border:1.5px solid var(--bd);border-bottom-width:3.5px;
  border-radius:18px;padding:14px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;
}
.guide-card:active{transform:translateY(1.5px)}
.theater-box{
  background:#ffffff;border:1.5px solid var(--ac);border-bottom-width:4px;
  border-radius:20px;overflow:hidden;margin-bottom:12px;
}
.theater-top{
  background:var(--ac);color:#ffffff;padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;gap:8px;
}
.theater-stage{padding:18px 14px;text-align:center;background:#ffffff}
.tk{cursor:pointer;border-bottom:1.5px dashed var(--ac);padding:0 2px;border-radius:3px}
.script-line{
  display:flex;gap:10px;align-items:center;padding:11px 12px;
  border:1.5px solid var(--bd);border-bottom-width:3px;border-radius:14px;
  background:#ffffff;cursor:pointer;margin-top:8px;
}
.script-line.cur{border-color:var(--ac);background:var(--ac-light)}
.blur-en{filter:blur(5px);cursor:pointer;transition:filter .15s}
.blur-en:hover,.blur-en:active{filter:blur(0)}

/* Word Mashup Chips */
.chip{
  display:inline-flex;align-items:center;padding:7px 12px;border-radius:12px;
  background:#ffffff;border:1.5px solid var(--bd);border-bottom-width:3px;
  font-size:13.5px;font-weight:800;cursor:pointer;margin:3px;
}
.chip.used{opacity:.3;pointer-events:none}
.slot-box{
  min-height:50px;border:1.5px dashed var(--ac-border);border-radius:14px;
  padding:8px;background:var(--surf-2);margin:10px 0;
}

/* AI Tutor Chat */
.chat-box{
  background:#ffffff;border:1.5px solid var(--bd);border-bottom-width:4px;
  border-radius:20px;overflow:hidden;
}
.chat-hdr{
  background:var(--ac);color:#ffffff;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.chat-msgs{
  padding:12px;max-height:380px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:10px;background:var(--surf-2);
}
.bubble{
  max-width:88%;padding:11px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;
  border:1.5px solid var(--bd);border-bottom-width:3px;background:#ffffff;color:var(--tx-dark);
}
.bubble.bot{align-self:flex-start;border-bottom-left-radius:4px}
.bubble.usr{align-self:flex-end;background:var(--ac);color:#ffffff;border-color:var(--ac-dark);border-bottom-right-radius:4px}
.bubble-en{font-size:13px;color:var(--tx);margin-top:6px;padding-top:6px;border-top:1px solid var(--surf-2);font-weight:700}
.bubble-tip{
  margin-top:6px;padding:7px 10px;border-radius:10px;
  background:var(--ac-light);color:var(--ac);font-size:12px;font-weight:800;
}
.web-sources{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.web-src-pill{
  display:inline-flex;align-items:center;gap:4px;
  background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;
  border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;text-decoration:none;
}
.chat-chips{
  padding:8px 10px;background:#ffffff;border-top:1.5px solid var(--bd);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
}
.chat-chips::-webkit-scrollbar{display:none}
.chat-bar{
  padding:8px 10px;background:#ffffff;border-top:1.5px solid var(--bd);
  display:flex;gap:6px;align-items:center;
}
.chat-bar input{margin-top:0;flex:1;min-width:0}
.mic-btn.rec{background:var(--ac);color:#ffffff;border-color:var(--ac-dark);animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

/* Language Pair Matrix Cards */
.lang-card{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-radius:18px;background:#ffffff;
  border:1.5px solid var(--bd);border-bottom-width:3.5px;margin-bottom:8px;cursor:pointer;
}
.lang-card.active{border-color:var(--ac);background:var(--ac-light)}
.lang-flag-circle{
  min-width:52px;height:40px;padding:0 8px;border-radius:12px;
  background:var(--surf-2);border:1.5px solid var(--bd);
  display:inline-flex;align-items:center;justify-content:center;gap:3px;
  font-size:17px;flex:none;
}
.lang-card.active .lang-flag-circle{background:#ffffff;border-color:var(--ac)}

/* Install Banner & Stats */
.install-banner{
  background:var(--ac-light);border:1.5px solid var(--ac-border);border-bottom-width:3px;
  border-radius:16px;padding:11px 13px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{
  background:#ffffff;border:1.5px solid var(--bd);border-bottom-width:3px;
  border-radius:16px;padding:12px;
}
.tile b{display:block;font-size:22px;font-weight:900;color:var(--ac);margin:2px 0}
.bars{display:flex;gap:8px;align-items:flex-end;height:86px;margin:10px 0 4px}
.bars div{flex:1;text-align:center;font-size:11.5px;font-weight:800;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:6px}
</style>
</head>
<body>
<div id="ios-quicklook-tip" style="background:#fff0f2;border-bottom:2px solid #ffc2cb;color:#b81028;padding:8px 14px;font-size:12px;font-weight:800;text-align:center">
  ⏳ Loading Polyglot Studio…
</div>

<!-- Top HUD -->
<header class="duo-top">
  <div class="duo-top-in">
    <div style="display:flex;align-items:center;gap:6px">
      <button class="duo-lang-pill" id="hud-lang" onclick="go('langs')" title="All 30 Language Pairs">
        <span id="hud-flag">🇵🇱</span>
        <span id="hud-pair">EN → PL</span>
        <span style="color:var(--ac);font-size:10px">▼</span>
      </button>
      <button class="swap-btn outline-red" onclick="swapOppositeLanguage()" title="Switch to Opposite Direction" aria-label="Swap Direction">
        <svg class="ico" viewBox="0 0 24 24"><path d="M7 16V4m0 0L3 8m4-4 4 4M17 8v12m0 0 4-4m-4 4-4-4"/></svg>
      </button>
    </div>
    <div class="duo-hud-stats">
      <span class="hud-item" id="hud-strk">0d</span>
      <span class="hud-item" id="hud-xp">0 XP</span>
      <button class="sm outline-red" onclick="go('stats')" title="Stats & App Install" aria-label="Stats">
        <svg class="ico" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Main Workspace -->
<main class="w">
  <div id="pwa-banner-wrap"></div>
  <div id="lv-wrap"></div>
  <div id="cat-wrap"></div>
  <div id="main"></div>
</main>

<!-- Bottom Tab Navigation -->
<nav class="duo-nav" aria-label="Primary Navigation">
  <div class="duo-nav-in" id="bottom-nav"></div>
</nav>

<script>
window.onerror=function(msg,src,line){
  var m=document.getElementById('main');
  if(m&&!m.innerHTML.trim())m.innerHTML='<div class="box"><b>Error:</b> '+msg+' (line '+line+')</div>';
};
</script>
<script>
const _MEM_STORE={};
const safeStore={
  get(k){
    if(Object.prototype.hasOwnProperty.call(_MEM_STORE,k))return _MEM_STORE[k];
    try{const v=window.localStorage.getItem(k);if(v!==null)_MEM_STORE[k]=v;return v}catch(e){return null}
  },
  set(k,v){
    _MEM_STORE[k]=String(v);
    try{window.localStorage.setItem(k,String(v))}catch(e){}
  }
};
const $=id=>document.getElementById(id);
const esc=t=>String(t||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const cl=(s,n)=>String(s||"").replace(/\s+/g," ").trim().slice(0,n||80);
const norm=s=>String(s||"").toLowerCase().replace(/ł/g,"l").replace(/ı/g,"i").replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").trim();
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* Safe Unicode-compatible word tokenizer (works on ALL iOS & Android WebViews without white-screen regex crashes) */
const WORD_RE=/[A-Za-zÀ-ÖØ-öø-ÿĀ-žİıŞşĞğÇçÖöÜüŁłĄąĆćĘęŃńÓóŚśŹźŻż]+/g;
const wl=t=>String(t||"").replace(WORD_RE,w=>`<span class="tk" onclick="event.stopPropagation();selW('${w.replace(/'/g,"")}')">${w}</span>`);

/* ===== PWA Icon, Manifest & Service Worker Setup for iPhone & Android ===== */
let DEFERRED_PROMPT=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  DEFERRED_PROMPT=e;
  render();
});

(function initMobilePWA(){
  try{
    if($("app-manifest")&&$("app-manifest").getAttribute("href"))return;
    const c=document.createElement("canvas");
    c.width=192;c.height=192;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#e51937";
    ctx.fillRect(0,0,192,192);
    ctx.fillStyle="#ffffff";
    ctx.font="bold 96px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("P",96,102);
    const pngUrl=c.toDataURL("image/png");
    if($("apple-icon"))$("apple-icon").href=pngUrl;
    if($("app-icon"))$("app-icon").href=pngUrl;

    const manifest={
      name:"Polyglot Studio",
      short_name:"Polyglot",
      start_url:"./",
      display:"standalone",
      background_color:"#ffffff",
      theme_color:"#e51937",
      orientation:"portrait",
      icons:[
        {src:pngUrl,sizes:"192x192",type:"image/png"},
        {src:pngUrl,sizes:"512x512",type:"image/png"}
      ]
    };
    if($("app-manifest"))$("app-manifest").href="data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(manifest));
  }catch(e){}
})();

/* ===== 6 Core Languages & Full 30 Bi-Directional Matrix ===== */
const LANG_META={
  pl:{code:"pl",speech:"pl-PL",flag:"🇵🇱",name:"Polish",native:"Polski",greet:"Cześć!",coach:"Zofia"},

/* ===== Complete Number-to-Words Engine (0 to 1,000,000) for PL, TR, EN, FR, DE, ES ===== */
function numToWords(n, lang){
  n = Math.floor(Number(n));
  if(isNaN(n) || n < 0) n = 0;
  if(n > 1000000) n = 1000000;

  if(lang === "en"){
    if(n === 0) return "zero";
    if(n === 1000000) return "one million";
    const ones=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
    const tens=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
    const under1000 = x => {
      let s = "";
      if(x >= 100){ s += ones[Math.floor(x/100)] + " hundred"; x %= 100; if(x) s += " "; }
      if(x >= 20){ s += tens[Math.floor(x/10)]; if(x%10) s += "-" + ones[x%10]; }
      else if(x > 0){ s += ones[x]; }
      return s;
    };
    let res = "";
    if(n >= 1000){ res += under1000(Math.floor(n/1000)) + " thousand"; n %= 1000; if(n) res += " "; }
    if(n > 0) res += under1000(n);
    return res.trim();
  }

  if(lang === "pl"){
    if(n === 0) return "zero";
    if(n === 1000000) return "jeden milion";
    const ones=["","jeden","dwa","trzy","cztery","pięć","sześć","siedem","osiem","dziewięć","dziesięć","jedenaście","dwanaście","trzynaście","czternaście","piętnaście","szesnaście","siedemnaście","osiemnaście","dziewiętnaście"];
    const tens=["","","dwadzieścia","trzydzieści","czterdzieści","pięćdziesiąt","sześćdziesiąt","siedemdziesiąt","osiemdziesiąt","dziewięćdziesiąt"];
    const huns=["","sto","dwieście","trzysta","czterysta","pięćset","sześćset","siedemset","osiemset","dziewięćset"];
    const under1000 = x => {
      const p = [];
      if(x >= 100){ p.push(huns[Math.floor(x/100)]); x %= 100; }
      if(x >= 20){ p.push(tens[Math.floor(x/10)]); x %= 10; }
      if(x > 0){ p.push(ones[x]); }
      return p.join(" ");
    };
    const parts = [];
    if(n >= 1000){
      const th = Math.floor(n/1000);
      if(th === 1){ parts.push("tysiąc"); }
      else {
        const last2 = th % 100, last1 = th % 10;
        const unit = (last1 >= 2 && last1 <= 4 && !(last2 >= 12 && last2 <= 14)) ? "tysiące" : "tysięcy";
        parts.push(under1000(th) + " " + unit);
      }
      n %= 1000;
    }
    if(n > 0) parts.push(under1000(n));
    return parts.join(" ").trim();
  }

  if(lang === "tr"){
    if(n === 0) return "sıfır";
    if(n === 1000000) return "bir milyon";
    const ones=["","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"];
    const tens=["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
    const under1000 = x => {
      const p = [];
      if(x >= 100){ const h = Math.floor(x/100); p.push(h === 1 ? "yüz" : ones[h] + " yüz"); x %= 100; }
      if(x >= 10){ p.push(tens[Math.floor(x/10)]); x %= 10; }
      if(x > 0){ p.push(ones[x]); }
      return p.join(" ");
    };
    const parts = [];
    if(n >= 1000){
      const th = Math.floor(n/1000);
      parts.push(th === 1 ? "bin" : under1000(th) + " bin");
      n %= 1000;
    }
    if(n > 0) parts.push(under1000(n));
    return parts.join(" ").trim();
  }

  if(lang === "de"){
    if(n === 0) return "null";
    if(n === 1000000) return "eine Million";
    const ones=["","ein","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
    const tens=["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
    const under1000 = (x, isEnd) => {
      let s = "";
      if(x >= 100){ s += ones[Math.floor(x/100)] + "hundert"; x %= 100; }
      if(x >= 20){
        const u = x % 10, t = Math.floor(x/10);
        s += (u > 0 ? ones[u] + "und" : "") + tens[t];
      } else if(x > 0){
        s += (x === 1 && isEnd) ? "eins" : ones[x];
      }
      return s;
    };
    let s = "";
    if(n >= 1000){
      const th = Math.floor(n/1000);
      s += (th === 1 ? "eintausend" : under1000(th, false) + "tausend");
      n %= 1000;
    }
    if(n > 0) s += under1000(n, true);
    return s;
  }

  if(lang === "fr"){
    if(n === 0) return "zéro";
    if(n === 1000000) return "un million";
    const ones=["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
    const tens=["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
    const under100 = x => {
      if(x < 20) return ones[x];
      const t = Math.floor(x/10), u = x % 10;
      if(t === 7 || t === 9){
        const base = tens[t];
        const rem = 10 + u;
        if(t === 7 && rem === 11) return "soixante et onze";
        return base + "-" + ones[rem];
      }
      if(t === 8){
        if(u === 0) return "quatre-vingts";
        return "quatre-vingt-" + ones[u];
      }
      if(u === 0) return tens[t];
      if(u === 1) return tens[t] + " et un";
      return tens[t] + "-" + ones[u];
    };
    const under1000 = (x, allowPluralCent) => {
      const p = [];
      if(x >= 100){
        const h = Math.floor(x/100);
        const rem = x % 100;
        if(h === 1) p.push("cent");
        else p.push(ones[h] + (rem === 0 && allowPluralCent ? " cents" : " cent"));
        x = rem;
      }
      if(x > 0) p.push(under100(x));
      return p.join(" ");
    };
    const parts = [];
    if(n >= 1000){
      const th = Math.floor(n/1000);
      parts.push(th === 1 ? "mille" : under1000(th, false) + " mille");
      n %= 1000;
    }
    if(n > 0) parts.push(under1000(n, true));
    return parts.join(" ").trim();
  }

  if(lang === "es"){
    if(n === 0) return "cero";
    if(n === 1000000) return "un millón";
    const ones=["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
    const tens=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
    const huns=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
    const under1000 = (x, beforeMil) => {
      if(x === 100) return "cien";
      const p = [];
      if(x >= 100){ p.push(huns[Math.floor(x/100)]); x %= 100; }
      if(x >= 30){
        const t = Math.floor(x/10), u = x % 10;
        p.push(tens[t] + (u > 0 ? " y " + (u === 1 && beforeMil ? "un" : ones[u]) : ""));
      } else if(x > 0){
        if(x === 1 && beforeMil) p.push("un");
        else if(x === 21 && beforeMil) p.push("veintiún");
        else p.push(ones[x]);
      }
      return p.join(" ");
    };
    const parts = [];
    if(n >= 1000){
      const th = Math.floor(n/1000);
      parts.push(th === 1 ? "mil" : under1000(th, true) + " mil");
      n %= 1000;
    }
    if(n > 0) parts.push(under1000(n, false));
    return parts.join(" ").trim();
  }
  return String(n);
}

function buildNumberConcept(n){
  const label = Number(n).toLocaleString("en-US");
  const obj = {lv: n <= 20 ? "A1" : n <= 1000 ? "A2" : "B1", cat: "Numbers (0–1M)", num: n};
  ["pl","tr","en","fr","de","es"].forEach(code => {
    obj[code] = `${numToWords(n, code)} (${label})`;
  });
  return obj;
}

const NUMBER_CONCEPTS = (function(){
  const vals = new Set();
  for(let i = 0; i <= 100; i++) vals.add(i);
  for(let i = 105; i <= 200; i += 5) vals.add(i);
  for(let i = 210; i <= 1000; i += 10) vals.add(i);
  for(let i = 1100; i <= 10000; i += 100) vals.add(i);
  for(let i = 11000; i <= 100000; i += 1000) vals.add(i);
  for(let i = 110000; i <= 1000000; i += 10000) vals.add(i);
  [123, 250, 365, 500, 750, 1250, 1999, 2025, 2026, 5000, 7500, 12500, 25000, 50000, 75000, 125000, 250000, 500000, 750000, 999999, 1000000].forEach(v => vals.add(v));
  return [...vals].sort((a,b) => a - b).map(buildNumberConcept);

      {pl:"Zapłacę kartą. Ile razem płacę za wszystko?",tr:"Kartla ödeyeceğim. Her şey için toplam ne kadar ödüyorum?",en:"I'll pay by card. How much do I pay in total?",fr:"Je paye par carte. Combien je dois au total ?",de:"Ich zahle mit Karte. Wie viel macht das insgesamt?",es:"Pagaré con tarjeta. ¿Cuánto es en total por todo?"},
      {pl:"Razem siedemdziesiąt osiem złotych i dwadzieścia groszy.",tr:"Toplam yetmiş sekiz zloti yirmi grosz.",en:"Seventy-eight zlotys and twenty groszy in total.",fr:"Soixante-dix-huit zlotys et vingt groszy au total.",de:"Insgesamt achtundsiebzig Zloty und zwanzig Groszy.",es:"Setenta y ocho zlotys con veinte groszy en total."},
      {pl:"Proszę przyłożyć kartę do terminala.",tr:"Lütfen kartınızı terminale yaklaştırın.",en:"Please tap your card on the terminal.",fr:"Veuillez poser votre carte sur le terminal.",de:"Bitte halten Sie Ihre Karte an das Terminal.",es:"Por favor, acerque su tarjeta al terminal."},
      {pl:"Czy potrzebuje pan fakturę czy zwykły paragon?",tr:"Fatura mı yoksa normal fiş mi istiyorsunuz?",en:"Do you need an invoice or a regular receipt?",fr:"Avez-vous besoin d'une facture ou d'un ticket ?",de:"Brauchen Sie eine Rechnung oder einen normalen Kassenbon?",es:"¿Necesita factura o un recibo normal?"},
      {pl:"Wystarczy zwykły paragon, dziękuję.",tr:"Normal fiş yeterli, teşekkür ederim.",en:"A regular receipt is enough, thank you.",fr:"Un simple ticket suffit, merci.",de:"Ein normaler Kassenbon reicht, danke.",es:"Con un recibo normal es suficiente, gracias."},
      {pl:"Czy mogę jeszcze dokupić wodę mineralną?",tr:"Bir de maden suyu satın alabilir miyim?",en:"Can I also buy a bottle of mineral water?",fr:"Puis-je encore ajouter une bouteille d'eau minérale ?",de:"Kann ich noch eine Flasche Mineralwasser dazukaufen?",es:"¿Puedo comprar también una botella de agua mineral?"},
      {pl:"Tak, woda niegazowana stoi tuż obok kasy.",tr:"Evet, gazsız su hemen kasanın yanında duruyor.",en:"Yes, still water is right next to the register.",fr:"Oui, l'eau plate est juste à côté de la caisse.",de:"Ja, stilles Wasser steht direkt neben der Kasse.",es:"Sí, el agua sin gas está justo al lado de la caja."},
      {pl:"Świetnie, poproszę dwie małe butelki.",tr:"Harika, iki küçük şişe lütfen.",en:"Great, two small bottles, please.",fr:"Parfait, deux petites bouteilles, s'il vous plaît.",de:"Super, bitte zwei kleine Flaschen.",es:"Genial, dos botellas pequeñas, por favor."},
      {pl:"Oto pana paragon oraz reszta z zakupów.",tr:"İşte fişiniz ve alışverişinizin kalanı.",en:"Here is your receipt and the rest of your items.",fr:"Voici votre ticket et le reste de vos achats.",de:"Hier ist Ihr Kassenbon und der Rest Ihres Einkaufs.",es:"Aquí tiene su recibo y el resto de su compra."},
      {pl:"Gdzie mogę oddać pusty koszyk sklepowy?",tr:"Boş alışveriş sepetini nereye bırakabilirim?",en:"Where can I return the empty shopping basket?",fr:"Où puis-je déposer le panier vide ?",de:"Wo kann ich den leeren Einkaufskorb abstellen?",es:"¿Dónde puedo dejar la cesta vacía?"},
      {pl:"Koszyki odkładamy przy drzwiach wyjściowych.",tr:"Sepetleri çıkış kapısının yanına bırakıyoruz.",en:"We stack the baskets by the exit doors.",fr:"On pose les paniers près des portes de sortie.",de:"Die Körbe stellen wir an den Ausgangstüren ab.",es:"Dejamos las cestas junto a las puertas de salida."},
      {pl:"Dziękuję bardzo i życzę miłego dnia!",tr:"Çok teşekkür ederim ve iyi günler dilerim!",en:"Thank you very much and have a nice day!",fr:"Merci beaucoup et bonne journée !",de:"Vielen Dank und einen schönen Tag noch!",es:"¡Muchas gracias y que tenga un buen día!"}
    ]
  },
  {
    id:2,e:"🚆",lv:"A2",
    title:{pl:"Dworzec Kolejowy & PKP",tr:"Tren İstasyonu & Bilet Gişesi",en:"Train Station & Tickets",fr:"Gare Ferroviaire & Billets",de:"Bahnhof & Fahrkarten",es:"Estación de Tren y Billetes"},
    cast:{pl:["Podróżny","Kasjerka"],tr:["Yolcu","Gişe Memuru"],en:["Traveler","Ticket Agent"],fr:["Voyageur","Guichetier"],de:["Reisender","Schalterbeamter"],es:["Viajero","Taquillero"]},
    lines:[
      {pl:"Dzień dobry, poproszę bilet na pociąg do Warszawy.",tr:"Günaydın, Varşova trenine bir bilet istiyorum, lütfen.",en:"Good morning, a ticket for the train to Warsaw, please.",fr:"Bonjour, un billet pour le train de Varsovie, s'il vous plaît.",de:"Guten Morgen, bitte eine Fahrkarte nach Warschau.",es:"Buenos días, un billete para el tren a Varsovia, por favor."},
      {pl:"Na dzisiaj czy na inny dzień tygodnia?",tr:"Bugün için mi yoksa haftanın başka bir günü için mi?",en:"For today or for another day of the week?",fr:"Pour aujourd'hui ou pour un autre jour ?",de:"Für heute oder für einen anderen Wochentag?",es:"¿Para hoy o para otro día de la semana?"},
      {pl:"Na dzisiaj, na najbliższy pociąg ekspresowy.",tr:"Bugün için, en yakın ekspres trenine.",en:"For today, on the next express train.",fr:"Pour aujourd'hui, sur le prochain train express.",de:"Für heute, für den nächsten Expresszug.",es:"Para hoy, en el próximo tren expreso."},
      {pl:"Najbliższy ekspres odjeżdża o godzinie czternastej trzydzieści.",tr:"En yakın ekspres saat on dört otuzda kalkıyor.",en:"The next express train departs at two thirty PM.",fr:"Le prochain express part à quatorze heures trente.",de:"Der nächste Expresszug fährt um vierzehn Uhr dreißig ab.",es:"El próximo expreso sale a las catorce treinta."},
      {pl:"Czy ten pociąg jedzie bezpośrednio bez przesiadek?",tr:"Bu tren aktarmasız doğrudan mı gidiyor?",en:"Does this train go directly without transfers?",fr:"Ce train est-il direct sans correspondance ?",de:"Fährt dieser Zug direkt ohne Umsteigen?",es:"¿Este tren va directo sin transbordos?"},
      {pl:"Tak, to bezpośrednie połączenie Intercity.",tr:"Evet, bu doğrudan bir Intercity seferidir.",en:"Yes, it is a direct Intercity connection.",fr:"Oui, c'est une liaison directe Intercity.",de:"Ja, das ist eine direkte Intercity-Verbindung.",es:"Sí, es una conexión directa Intercity."},
      {pl:"Ile czasu trwa cała podróż do centrum Warszawy?",tr:"Varşova merkezine tüm yolculuk ne kadar sürüyor?",en:"How long does the whole journey to central Warsaw take?",fr:"Combien de temps dure le trajet jusqu'au centre ?",de:"Wie lange dauert die gesamte Fahrt ins Zentrum?",es:"¿Cuánto dura todo el viaje hasta el centro?"},
      {pl:"Podróż trwa dokładnie dwie godziny i czterdzieści minut.",tr:"Yolculuk tam iki saat kırk dakika sürüyor.",en:"The trip takes exactly two hours and forty minutes.",fr:"Le voyage dure exactement deux heures quarante.",de:"Die Fahrt dauert genau zwei Stunden vierzig Minuten.",es:"El viaje dura exactamente dos horas y cuarenta minutos."},
      {pl:"Czy są jeszcze wolne miejsca w drugiej klasie?",tr:"İkinci sınıfta hala boş yer var mı?",en:"Are there still free seats in second class?",fr:"Y a-t-il encore des places en seconde classe ?",de:"Gibt es noch freie Plätze in der zweiten Klasse?",es:"¿Quedan asientos libres en segunda clase?"},
      {pl:"Tak, mam wolne miejsca przy oknie w wagonie numer pięć.",tr:"Evet, beş numaralı vagonda pencere kenarında boş yerlerim var.",en:"Yes, I have window seats available in carriage five.",fr:"Oui, j'ai des places côté fenêtre en voiture cinq.",de:"Ja, ich habe Fensterplätze in Wagen Nummer fünf frei.",es:"Sí, tengo asientos junto a la ventana en el coche cinco."},
      {pl:"Poproszę jedno miejsce przy oknie w strefie ciszy.",tr:"Sessiz bölgede pencere kenarı bir koltuk rica ediyorum.",en:"One window seat in the quiet zone, please.",fr:"Une place côté fenêtre en zone calme, s'il vous plaît.",de:"Bitte einen Fensterplatz im Ruhebereich.",es:"Un asiento junto a la ventana en la zona de silencio, por favor."},
      {pl:"Czy przysługuje panu zniżka studencka lub seniorska?",tr:"Öğrenci veya yaşlı indiriminiz var mı?",en:"Are you eligible for a student or senior discount?",fr:"Bénéficiez-vous d'une réduction étudiante ou senior ?",de:"Haben Sie Anspruch auf Studenten- oder Seniorenrabatt?",es:"¿Tiene derecho a descuento de estudiante o senior?"},
      {pl:"Nie, poproszę zwykły bilet normalny w jedną stronę.",tr:"Hayır, tek yön normal tam bilet istiyorum, lütfen.",en:"No, a standard one-way ticket, please.",fr:"Non, un billet plein tarif aller simple, s'il vous plaît.",de:"Nein, bitte eine normale Einzelfahrkarte.",es:"No, un billete normal de solo ida, por favor."},
      {pl:"Czy mogę od razu kupić bilet powrotny na niedzielę?",tr:"Pazar günü için dönüş biletini de şimdiden alabilir miyim?",en:"Can I also buy the return ticket for Sunday right now?",fr:"Puis-je acheter le billet retour pour dimanche maintenant ?",de:"Kann ich gleich die Rückfahrkarte für Sonntag kaufen?",es:"¿Puedo comprar ya el billete de vuelta para el domingo?"},
      {pl:"Oczywiście, bilet powrotny daje dziesięć procent zniżki.",tr:"Elbette, dönüş bileti yüzde on indirim sağlıyor.",en:"Of course, a return ticket gives a ten percent discount.",fr:"Bien sûr, l'aller-retour offre dix pour cent de réduction.",de:"Natürlich, die Rückfahrkarte gibt zehn Prozent Rabatt.",es:"Por supuesto, el billete de vuelta tiene un diez por ciento de descuento."},
      {pl:"W takim razie poproszę bilet w obie strony na niedzielę wieczór.",tr:"O halde Pazar akşamı için gidiş-dönüş bilet istiyorum.",en:"In that case, a round-trip ticket for Sunday evening, please.",fr:"Dans ce cas, un aller-retour pour dimanche soir.",de:"Dann bitte eine Hin- und Rückfahrkarte für Sonntagabend.",es:"En ese caso, un billete de ida y vuelta para el domingo por la tarde."},
      {pl:"Czy muszę dopłacić za duży bagaż lub walizkę?",tr:"Büyük bagaj veya valiz için ek ücret ödemem gerekiyor mu?",en:"Do I have to pay extra for large luggage or a suitcase?",fr:"Dois-je payer un supplément pour une grande valise ?",de:"Muss ich für großes Gepäck oder einen Koffer zuzahlen?",es:"¿Tengo que pagar suplemento por equipaje grande o maleta?"},
      {pl:"Nie, bagaż podręczny i jedna duża walizka są bezpłatne.",tr:"Hayır, el bagajı ve bir büyük valiz ücretsizdir.",en:"No, hand luggage and one large suitcase are free.",fr:"Non, le bagage à main et une grande valise sont gratuits.",de:"Nein, Handgepäck und ein großer Koffer sind kostenlos.",es:"No, el equipaje de mano y una maleta grande son gratis."},
      {pl:"Ile kosztują oba bilety razem?",tr:"Her iki bilet toplam ne kadar tutuyor?",en:"How much do both tickets cost together?",fr:"Combien coûtent les deux billets ensemble ?",de:"Wie viel kosten beide Fahrkarten zusammen?",es:"¿Cuánto cuestan los dos billetes juntos?"},
      {pl:"Sto trzydzieści pięć złotych za przejazd w obie strony.",tr:"Gidiş-dönüş yolculuk için yüz otuz beş zloti.",en:"One hundred thirty-five zlotys for the round trip.",fr:"Cent trente-cinq zlotys pour l'aller-retour.",de:"Einhundertfünfunddreißig Zloty für Hin- und Rückfahrt.",es:"Ciento treinta y cinco zlotys por ida y vuelta."},
      {pl:"Płacę kartą. Czy dostanę bilet papierowy czy elektroniczny?",tr:"Kartla ödüyorum. Kağıt bilet mi yoksa elektronik bilet mi alacağım?",en:"I'm paying by card. Will I get a paper or electronic ticket?",fr:"Je paye par carte. Aurai-je un billet papier ou numérique ?",de:"Ich zahle mit Karte. Bekomme ich ein Papier- oder Online-Ticket?",es:"Pago con tarjeta. ¿Recibiré billete en papel o electrónico?"},
      {pl:"Drukuję bilet papierowy, ale może pan też zeskanować kod QR.",tr:"Kağıt bileti yazdırıyorum ama QR kodu da tarayabilirsiniz.",en:"I'm printing the paper ticket, or you can scan the QR code.",fr:"J'imprime le billet papier, ou scannez le code QR.",de:"Ich drucke das Papierticket, oder Sie scannen den QR-Code.",es:"Imprimo el billete en papel, o puede escanear el código QR."},
      {pl:"Z którego peronu i toru odjeżdża mój pociąg?",tr:"Trenim hangi peron ve hattan kalkıyor?",en:"From which platform and track does my train depart?",fr:"De quel quai et de quelle voie part mon train ?",de:"Von welchem Bahnsteig und Gleis fährt mein Zug ab?",es:"¿De qué andén y vía sale mi tren?"},
      {pl:"Z peronu trzeciego, przy torze drugim.",tr:"Üçüncü peron, ikinci hattan.",en:"From platform three, at track two.",fr:"Du quai numéro trois, voie deux.",de:"Von Bahnsteig drei, Gleis zwei.",es:"Del andén número tres, vía dos."},
      {pl:"Jak dojść z hali głównej na peron trzeci?",tr:"Ana salondan üçüncü perona nasıl gidilir?",en:"How do I get from the main hall to platform three?",fr:"Comment aller du hall principal au quai trois ?",de:"Wie komme ich von der Haupthalle zu Bahnsteig drei?",es:"¿Cómo llego desde el vestíbulo principal al andén tres?"},
      {pl:"Proszę zejść schodami do przejścia podziemnego po prawej.",tr:"Sağ taraftaki alt geçit merdivenlerinden aşağı inin.",en:"Go down the stairs to the underpass on the right.",fr:"Descendez les escaliers du passage souterrain à droite.",de:"Gehen Sie rechts die Treppe zur Unterführung hinunter.",es:"Baje las escaleras al paso subterráneo a la derecha."},
      {pl:"Czy na dworcu jest winda dla osób z walizkami?",tr:"İstasyonda valizli yolcular için asansör var mı?",en:"Is there an elevator at the station for people with suitcases?",fr:"Y a-t-il un ascenseur à la gare pour les valises ?",de:"Gibt es am Bahnhof einen Aufzug für Reisende mit Koffern?",es:"¿Hay ascensor en la estación para personas con maletas?"},
      {pl:"Tak, winda znajduje się tuż obok tablicy odjazdów.",tr:"Evet, asansör hemen kalkış panosunun yanında bulunuyor.",en:"Yes, the elevator is right next to the departure board.",fr:"Oui, l'ascenseur est juste à côté du panneau des départs.",de:"Ja, der Aufzug befindet sich direkt neben der Abfahrtstafel.",es:"Sí, el ascensor está justo al lado del panel de salidas."},
      {pl:"Czy pociąg ma dzisiaj jakieś opóźnienie?",tr:"Bugün trenin herhangi bir gecikmesi var mı?",en:"Does the train have any delay today?",fr:"Le train a-t-il du retard aujourd'hui ?",de:"Hat der Zug heute Verspätung?",es:"¿Tiene algún retraso el tren hoy?"},
      {pl:"Nie, pociąg podstawia się punktualnie za dziesięć minut.",tr:"Hayır, tren on dakika içinde tam vaktinde perona yanaşıyor.",en:"No, the train arrives at the platform on time in ten minutes.",fr:"Non, le train arrive à quai à l'heure dans dix minutes.",de:"Nein, der Zug fährt in zehn Minuten pünktlich ein.",es:"No, el tren llega al andén puntual en diez minutos."},
      {pl:"Czy w pociągu jest wagon restauracyjny Wars?",tr:"Trende yemekli vagon mevcut mu?",en:"Is there a dining car on the train?",fr:"Y a-t-il une voiture-restaurant dans le train ?",de:"Gibt es einen Speisewagen im Zug?",es:"¿Hay coche restaurante en el tren?"},
      {pl:"Tak, wagon restauracyjny znajduje się w środku składu. Szczęśliwej podróży!",tr:"Evet, yemekli vagon trenin ortasında yer alıyor. İyi yolculuklar!",en:"Yes, the dining car is in the middle of the train. Safe travels!",fr:"Oui, la voiture-restaurant est au milieu du train. Bon voyage !",de:"Ja, der Speisewagen ist in der Mitte des Zuges. Gute Reise!",es:"Sí, el coche restaurante está en medio del tren. ¡Buen viaje!"}
    ]
  },
  {
    id:3,e:"🍽️",lv:"A1",
    title:{pl:"Restauracja & Kawiarnia",tr:"Restoran & Kafe",en:"Restaurant & Café",fr:"Restaurant & Café",de:"Restaurant & Café",es:"Restaurante y Café"},
    cast:{pl:["Gość","Kelnerka"],tr:["Müşteri","Garson"],en:["Guest","Waiter"],fr:["Client","Serveur"],de:["Gast","Kellner"],es:["Cliente","Camarero"]},
    lines:[
      {pl:"Dzień dobry, czy mają państwo wolny stolik dla dwóch osób?",tr:"İyi günler, iki kişilik boş masanız var mı?",en:"Good afternoon, do you have a free table for two people?",fr:"Bonjour, avez-vous une table libre pour deux personnes ?",de:"Guten Tag, haben Sie einen freien Tisch für zwei Personen?",es:"Buenas tardes, ¿tienen una mesa libre para dos personas?"},
      {pl:"Dzień dobry! Tak, zapraszam do stolika przy oknie.",tr:"İyi günler! Evet, pencere kenarındaki masaya buyurun.",en:"Good afternoon! Yes, please come to the table by the window.",fr:"Bonjour ! Oui, je vous invite à la table près de la fenêtre.",de:"Guten Tag! Ja, bitte nehmen Sie am Fensterplatz Platz.",es:"¡Buenas tardes! Sí, pasen a la mesa junto a la ventana."},
      {pl:"Czy możemy prosić o kartę dań oraz kartę napojów?",tr:"Yemek menüsünü ve içecek listesini rica edebilir miyiz?",en:"Could we ask for the food menu and the drink list?",fr:"Pouvons-nous avoir la carte des plats et des boissons ?",de:"Könnten wir bitte die Speisekarte und Getränkekarte haben?",es:"¿Podemos pedir la carta de comidas y de bebidas?"},
      {pl:"Oczywiście, oto menu po polsku i po angielsku.",tr:"Elbette, işte yerel dilde ve İngilizce menü.",en:"Of course, here is the menu in the local language and English.",fr:"Bien sûr, voici le menu en français et en anglais.",de:"Natürlich, hier ist die Speisekarte auf Deutsch und Englisch.",es:"Por supuesto, aquí tiene el menú en español e inglés."},
      {pl:"Co poleca pani dzisiaj z tradycyjnej kuchni?",tr:"Bugün geleneksel mutfaktan ne tavsiye edersiniz?",en:"What do you recommend today from traditional cuisine?",fr:"Que recommandez-vous aujourd'hui de la cuisine traditionnelle ?",de:"Was empfehlen Sie heute aus der traditionellen Küche?",es:"¿Qué nos recomienda hoy de la cocina tradicional?"},
      {pl:"Gorąco polecam domowy żurek oraz pierogi ruskie.",tr:"Ev yapımı geleneksel çorbayı ve mantıyı şiddetle tavsiye ederim.",en:"I warmly recommend the homemade soup and traditional dumplings.",fr:"Je recommande vivement la soupe maison et le plat du jour.",de:"Ich empfehle wärmstens die hausgemachte Tagessuppe.",es:"Recomiendo mucho la sopa casera y el plato tradicional."},
      {pl:"Czy pierogi są podawane ze śmietaną czy z cebulką?",tr:"Yemek krema ile mi yoksa karamelize soğanla mı servis ediliyor?",en:"Is the dish served with sour cream or fried onions?",fr:"Le plat est-il servi avec de la crème ou des oignons ?",de:"Wird das Gericht mit Sauerrahm oder Röstzwiebeln serviert?",es:"¿El plato se sirve con crema agria o cebolla frita?"},
      {pl:"Możemy podać je z zeszkloną cebulką albo ze śmietaną.",tr:"Hem kavrulmuş soğanla hem de krema ile servis edebiliriz.",en:"We can serve them with sautéed onions or sour cream.",fr:"Nous pouvons le servir avec des oignons ou de la crème.",de:"Wir können es mit gedünsteten Zwiebeln oder Rahm servieren.",es:"Podemos servirlo con cebolla pochada o crema agria."},
      {pl:"Czy mają państwo w menu dania wegetariańskie?",tr:"Menünüzde vejetaryen yemekler mevcut mu?",en:"Do you have vegetarian dishes on the menu?",fr:"Avez-vous des plats végétariens au menu ?",de:"Haben Sie vegetarische Gerichte auf der Speisekarte?",es:"¿Tienen platos vegetarianos en el menú?"},
      {pl:"Tak, mamy pierogi ze szpinakiem oraz świeże sałatki.",tr:"Evet, ıspanaklı ana yemeğimiz ve taze salatalarımız var.",en:"Yes, we have spinach specialties and fresh salads.",fr:"Oui, nous avons des spécialités aux épinards et des salades.",de:"Ja, wir haben Spinatgerichte und frische Salate.",es:"Sí, tenemos especialidades de espinacas y ensaladas frescas."},
      {pl:"Czy to danie zawiera orzechy albo gluten?",tr:"Bu yemek kuruyemiş veya glüten içeriyor mu?",en:"Does this dish contain nuts or gluten?",fr:"Ce plat contient-il des noix ou du gluten ?",de:"Enthält dieses Gericht Nüsse oder Gluten?",es:"¿Este plato contiene frutos secos o gluten?"},
      {pl:"Nie zawiera orzechów, ale w cieście jest mąka pszenna.",tr:"Kuruyemiş içermez ancak hamurunda buğday unu vardır.",en:"It contains no nuts, though there is wheat flour in the dough.",fr:"Il ne contient pas de noix, mais il y a de la farine de blé.",de:"Es enthält keine Nüsse, aber Weizenmehl im Teig.",es:"No contiene frutos secos, pero lleva harina de trigo."},
      {pl:"Rozumiem, w takim razie wybiorę grillowanego łososia z warzywami.",tr:"Anladım, o halde sebzeli ızgara somon seçeceğim.",en:"I understand, in that case I'll choose grilled salmon with vegetables.",fr:"Je comprends, je vais choisir le saumon grillé aux légumes.",de:"Verstehe, dann wähle ich den gegrillten Lachs mit Gemüse.",es:"Entiendo, en ese caso elegiré el salmón a la plancha con verduras."},
      {pl:"A dla drugiej osoby poproszę zupę dnia i pierogi.",tr:"İkinci kişi için de günün çorbasını ve ana yemeği rica ediyorum.",en:"And for the second person, the soup of the day and main dish, please.",fr:"Et pour la deuxième personne, la soupe du jour et le plat.",de:"Und für die zweite Person bitte die Tagessuppe und das Hauptgericht.",es:"Y para la segunda persona, la sopa del día y el plato principal."},
      {pl:"Co podać państwu do picia przed posiłkiem?",tr:"Yemekten önce içmek için size ne getirebilirim?",en:"What can I bring you to drink before the meal?",fr:"Que puis-je vous servir à boire avant le repas ?",de:"Was darf ich Ihnen vor dem Essen zu trinken bringen?",es:"¿Qué les traigo de beber antes de la comida?"},

let ST={d:{},goal:10,clips:[]};try{const x=JSON.parse(safeStore.get("pl-stats")||"null");if(x)ST=x}catch(e){}
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const saveST=()=>{try{safeStore.set("pl-stats",JSON.stringify(ST))}catch(e){}};
setInterval(()=>{if(!document.hidden){const k=dk(new Date());ST.d[k]=(ST.d[k]||0)+10;saveST()}},10000);
function streak(){let n=0,d=new Date();if((ST.d[dk(d)]||0)<30)d.setDate(d.getDate()-1);while((ST.d[dk(d)]||0)>=30){n++;d.setDate(d.getDate()-1)}return n}

function loadPairState(){
  const pid=CUR_PAIR||"en-pl";
  S.prog={};
  try{
    const p=safeStore.get("lp-prog-"+pid)||(pid==="en-pl"?safeStore.get("pl-prog2"):null);
    if(p)S.prog=JSON.parse(p);
    const l=safeStore.get("lp-lvl-"+pid)||safeStore.get("pl-lvl");
    if(l&&LV[l])S.lvl=l;
  }catch(e){}
}
const save=()=>{
  const pid=CUR_PAIR||"en-pl";
  try{

    if(pid==="en-pl")safeStore.set("pl-prog2",JSON.stringify(S.prog));
  }catch(e){}

function xp(n){S.prog._xp=(S.prog._xp||0)+n;save()}
function setP(w,ok){S.prog[w[0]]=ok?(S.prog[w[0]]||0)+1:0;if(ok)xp(S.lvl==="B1"?3:S.lvl==="A2"?2:1);save()}

let SC=[];
function rebuildDictionary(){
  const ap=getActivePair();
  const srcCode=ap.src||"en";
  const tgtCode=ap.tgt||"pl";

  ["A1","A2","B1"].forEach(lv=>{D[lv]={};});
  const seen=new Set();

  [...EXPANDED_CONCEPTS, ...NUMBER_CONCEPTS].forEach(c=>{
    const tgt=c[tgtCode]||c.pl;
    const src=c[srcCode]||c.en;
    const k=tgt.toLowerCase();
    if(!tgt||!src||seen.has(k))return;
    seen.add(k);
    if(!D[c.lv][c.cat])D[c.lv][c.cat]=[];
    D[c.lv][c.cat].push([tgt,"",src,{concept:c,cat:c.cat}]);
  });

  PW.filter(w=>(w.pairId||"en-pl")===CUR_PAIR).forEach(w=>{
    const lv=LV[w.lvl]?w.lvl:"A1";
    const cat=w.cat||"My Words";
    if(!D[lv][cat])D[lv][cat]=[];
    if(!seen.has(w.pl.toLowerCase())){
      seen.add(w.pl.toLowerCase());
      D[lv][cat].push([w.pl,w.pron||"",w.en,{cat}]);
    }
  });

  ["A1","A2","B1"].forEach(lv=>{
    if(!Object.keys(D[lv]).length)D[lv]["Vocabulary"]=[];
  });

  SC=MULTI_SCENES.map(sc=>({
    id:sc.id,
    e:sc.e,
    l:`${sc.lv} · ${LV[sc.lv]}`,
    t:sc.title[tgtCode]||sc.title.en,
    sh:sc.title[srcCode]||sc.title.en,
    cast:sc.cast.en,
    L:sc.lines.map(ln=>[ln[tgtCode]||ln.en,ln[srcCode]||ln.en,ln])
  }));
}

loadPairState();
rebuildDictionary();

const P=()=>{
  const L=D[S.lvl]||{};
  if(S.cat!=="All"&&L[S.cat])return L[S.cat];
  return Object.entries(L).flatMap(([cat,arr])=>arr.map(w=>[w[0],w[1],w[2],{...(w[3]||{}),cat}]));
};
const all=()=>["A1","A2","B1"].flatMap(lv=>Object.values(D[lv]||{}).flat());
function uniq(){
  const m=new Map();
  all().forEach(w=>{const k=w[0].toLowerCase();if(!m.has(k))m.set(k,w)});
  return[...m.values()];
}

function smartLookup(rawWord){
  const w=String(rawWord||"").toLowerCase().trim();
  if(!w)return null;
  const hit=all().find(x=>x[0].toLowerCase()===w||x[0].toLowerCase().endsWith(" "+w));
  if(hit)return{pl:hit[0],en:hit[2],concept:hit[3]?.concept||null};
  for(const sc of SC){
    for(const line of sc.L){
      const toks=line[0].toLowerCase().match(WORD_RE)||[];
      if(toks.includes(w))return{pl:w,en:line[1],concept:line[2]||null};
    }
  }
  return null;
}

const QM={

function newQuiz(){
  const ap=getActivePair();
  const len=S.ql||10;
  const mode=S.qm||"src2tgt";
  const pool=sh(P().slice(0,250));
  const qs=[];
  for(let i=0;i<Math.min(len,pool.length);i++){
    const w=pool[i];
    if(mode==="tgt2src"){
      qs.push({mode,w,prompt:w[0],ans:w[2],placeholder:`Type in ${ap.srcName}…`,hint:`Translate from ${ap.tgtName} to ${ap.srcName}`,say:w[0]});
    }else if(mode==="listen"){
      qs.push({mode,w,prompt:"",ans:w[0],placeholder:`Type the ${ap.tgtName} word you hear…`,hint:`Listen and type in ${ap.tgtName}`,say:w[0]});
    }else{
      qs.push({mode:"src2tgt",w,prompt:w[2],ans:w[0],placeholder:`Type in ${ap.tgtName}…`,hint:`Translate from ${ap.srcName} to ${ap.tgtName}`,say:w[0]});
    }
  }
  S.q=qs;S.miss=[];S.n=0;S.score=0;S.done=false;S.sel=null;S.typed="";
}

function quiz(m){
  const ap=getActivePair();
  if(!S.q)newQuiz();

  const modeBar=`
    <div class="cats">
      ${Object.entries(QM).map(([k,l])=>`<button class="cat-chip ${(S.qm||"src2tgt")===k?"on":""}" onclick="S.qm='${k}';newQuiz();render()">${l}</button>`).join("")}
    </div>
  `;

  if(!S.q.length){
    m.innerHTML=modeBar+`<div class="duo-card"><div class="hint">No words available in this filter.</div></div>`;
    return;
  }

  if(S.done){
    const pct=Math.round(S.score/S.q.length*100);
    const miss=S.miss||[];
    m.innerHTML=modeBar+`
      <div class="duo-card" style="cursor:default">
        <span class="badge">${esc(ap.short)} · ${S.lvl}</span>

      </div>
      ${miss.length?`<div class="box" style="margin-top:12px"><b>Words to Review</b>${miss.map(q=>`<div class="stat-row"><span>${esc(q.prompt||q.w[2])}</span><b style="color:var(--ac)">${esc(q.ans)}</b></div>`).join("")}</div>`:""}
      <div class="row">
        ${miss.length?`<button class="outline-red" onclick="S.q=sh(S.miss);S.miss=[];S.n=0;S.score=0;S.done=false;S.sel=null;S.typed='';render()">↻ Retry Missed</button>`:""}
        <button class="primary" onclick="newQuiz();render()">New Quiz →</button>
      </div>
    `;
    return;
  }

  const q=S.q[S.n],ans=S.sel!==null;
  if(q.mode==="listen"&&!ans&&!q.played){q.played=true;setTimeout(()=>speak(q.say),220)}

  m.innerHTML=modeBar+`
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="hint">${esc(q.hint)}</span>
      <span class="badge">${S.n+1} / ${S.q.length}</span>
    </div>
    <div class="duo-prog"><i style="width:${(S.n+(ans?1:0))/S.q.length*100}%"></i></div>

    <div class="duo-card" style="cursor:default;min-height:160px">
      <span class="badge neutral">${S.lvl} · ${LV[S.lvl]}</span>
      ${q.mode==="listen"
        ? `<div style="display:flex;gap:10px;margin:8px 0">
             <button class="primary" style="font-size:24px;padding:12px 22px" onclick="speak(S.q[S.n].say)">🔊</button>
             <button onclick="speak(S.q[S.n].say,0.58)">🐢 Slow</button>
           </div>`
        : `<div class="big-word">${esc(q.prompt)}</div>`
      }
    </div>

    <input id="ans" class="text-quiz-input" placeholder="${esc(q.placeholder)}" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" value="${esc(ans?S.typed:"")}" ${ans?"disabled":""} onkeydown="if(event.key==='Enter')chk()">

    ${ans?`
      <div class="fb-sheet ${S.right?"":"wrong"}">
        <div style="font-weight:900;font-size:15px;color:${S.right?"var(--ac)":"var(--tx-dark)"}">
          ${S.right?"✓ Correct!":"✗ Correct answer:"}
        </div>
        <div style="font-weight:900;font-size:19px;margin-top:4px;color:var(--ac)">${esc(q.ans)}</div>
      </div>
    `:""}

    <div class="row">
      <button onclick="speak(S.q[S.n].say)">🔊 Hear</button>
      ${ans
        ? `<button class="primary" onclick="nx()">Continue →</button>`
        : `<button class="outline-red" onclick="skipTextQ()">Skip</button>
           <button class="primary" onclick="chk()">Check</button>`
      }
    </div>
  `;
}

function qResult(ok){
  const q=S.q[S.n];
  S.right=ok;if(ok)S.score++;else (S.miss=S.miss||[]).push(q);
  if(q.w)setP(q.w,ok);
  if(q.say)speak(q.say);
  render();
}
function chk(){
  if(S.sel!==null)return nx();
  const q=S.q[S.n];
  const v=($("ans")?$("ans").value:"");
  S.typed=v;S.sel=1;
  qResult(norm(v)===norm(q.ans));
}
function skipTextQ(){if(S.sel!==null)return;S.typed="";S.sel=1;qResult(false)}
function nx(){S.sel=null;S.typed="";S.n++;if(S.n>=S.q.length)S.done=true;render()}

/* Live Web Search via Wikipedia & DuckDuckGo Instant Answer APIs (CORS-enabled, no API key required!) */
async function fetchLiveWebKnowledge(query,langCode){
  const sources=[];
  let webContext="";
  try{
    const wikiUrl=`https://${langCode}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=2`;
    const r=await fetch(wikiUrl);
    const j=await r.json();
    const hits=j?.query?.search||[];
    for(const h of hits){
      const cleanSnip=h.snippet.replace(/<[^>]+>/g,"");
      webContext+=`${h.title}: ${cleanSnip}\n`;
      sources.push({title:h.title,url:`https://${langCode}.wikipedia.org/wiki/${encodeURIComponent(h.title.replace(/ /g,"_"))}`});
    }
  }catch(e){}

  if(!webContext&&langCode!=="en"){
    try{
      const enUrl=`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=2`;
      const r2=await fetch(enUrl);
      const j2=await r2.json();
      const hits2=j2?.query?.search||[];
      for(const h of hits2){
        const cleanSnip=h.snippet.replace(/<[^>]+>/g,"");
        webContext+=`${h.title}: ${cleanSnip}\n`;
        sources.push({title:h.title,url:`https://en.wikipedia.org/wiki/${encodeURIComponent(h.title.replace(/ /g,"_"))}`});
      }
    }catch(e){}
  }
  return{webContext:webContext.trim(),sources};
}

/* Free Web Translation API (MyMemory) for live multilingual synthesis */
async function translateViaWeb(text,fromCode,toCode){
  try{
    const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0,380))}&langpair=${fromCode}|${toCode}`;
    const r=await fetch(url);
    const j=await r.json();
    const tr=j?.responseData?.translatedText;
    if(tr&&!tr.includes("MYMEMORY WARNING"))return tr;
  }catch(e){}
  return "";
}

  // 3. Keyless Web-Connected Smart Engine (Live Wikipedia + Live Web Translation + 5K Lexicon + 320 Scenario Lines)
  const q=norm(userRaw);

  // Check if user is asking to translate or explain a word/phrase
  const matchedConcept=EXPANDED_CONCEPTS.find(c=>{

  if(matchedConcept){

      sources:webData.sources.slice(0,2)

  // If live Wikipedia returned knowledge for the user's topic, synthesize a bilingual web-grounded response!

function dsearch(){
  const rawQ=String(DI.q||"").trim();
  const q=norm(rawQ),el=$("dr");if(!el)return;
  const allU=uniq();
  let filtered=q?allU.filter(w=>norm(w[0]).includes(q)||norm(w[2]).includes(q)):allU;
  const numMatch=rawQ.replace(/[,\s]/g,"").match(/^\d+$/);
  if(numMatch){
    const n=Math.min(1000000,parseInt(numMatch[0],10));
    const ap=getActivePair();
    const c=buildNumberConcept(n);
    const synth=[c[ap.tgt], "", c[ap.src], {concept:c, cat:"Numbers (0–1M)"}];
    if(!filtered.some(w=>w[0]===synth[0])) filtered=[synth, ...filtered];
  }
  const pageSize=30;
  const maxPage=Math.max(0,Math.ceil(filtered.length/pageSize)-1);
  if(DI.page>maxPage)DI.page=maxPage;
  const slice=filtered.slice(DI.page*pageSize,(DI.page+1)*pageSize);

  el.innerHTML=`<div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="hint">Showing ${slice.length} of ${filtered.length.toLocaleString()}</span>
      <div style="display:flex;gap:6px">
        <button class="sm" ${DI.page===0?"disabled":""} onclick="DI.page--;dsearch()">←</button>
        <span class="badge neutral">${DI.page+1}/${maxPage+1}</span>
        <button class="sm" ${DI.page>=maxPage?"disabled":""} onclick="DI.page++;dsearch()">→</button>
      </div>
    </div>
    ${slice.map(w=>{
      const c=w[3]?.concept;
      return `<div class="stat-row" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <b style="font-size:16px;color:var(--tx-dark)">${esc(w[0])}</b>
            <span style="color:var(--ac);font-weight:800;font-size:13px"> · ${esc(w[2])}</span>
          </div>
          <button class="sm" data-t="${esc(w[0])}" onclick="say(this)">🔊</button>
        </div>
        ${c?`<div class="bridge-grid" style="justify-content:flex-start;margin-top:4px">
          ${["pl","tr","en","fr","de","es"].map(code=>`<span class="bridge-pill" style="font-size:11px;padding:2px 7px" onclick="speak('${esc(c[code])}',0.9,'${LANG_META[code].speech}')">${LANG_META[code].flag} ${esc(c[code])}</span>`).join("")}
        </div>`:""}
      </div>`;
    }).join("")}
  </div>`;
}

function addSingleWord(){

/* ===== REVIEW TAB: spaced repetition + sentence builder + speaking ===== */
let RV={t:"srs",q:[],i:0,rev:false,done:0,good:0,nw:0,sb:null,sbs:0,sp:null,spMsg:""};
const srsKey=()=>"lp-srs-"+(CUR_PAIR||"en-pl"),dayK=()=>new Date().toISOString().slice(0,10);
function srsMap(){try{return JSON.parse(localStorage.getItem(srsKey())||"{}")}catch(e){return{}}}
function srsSave(m){try{localStorage.setItem(srsKey(),JSON.stringify(m))}catch(e){}}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function srsStart(){const m=srsMap(),idx=new Map(all().map(w=>[w[0],w])),now=Date.now();
 const due=Object.keys(m).filter(k=>k[0]!=="_"&&m[k].d<=now&&idx.has(k)).map(k=>idx.get(k));
 const used=(m._n&&m._n.t===dayK())?m._n.c:0,left=Math.max(0,10-used);
 const nw=sh(P().filter(w=>!m[w[0]])).slice(0,left);
 m._n={t:dayK(),c:used+nw.length};srsSave(m);
 RV={...RV,q:[...sh(due),...nw],i:0,rev:false,done:0,good:0,nw:nw.length}}
function srsGrade(g){const m=srsMap(),w=RV.q[RV.i],c=m[w[0]]||{i:0,e:2.5,r:0};
 if(g===0){c.e=Math.max(1.3,c.e-.2);c.i=0;c.r=0;c.d=Date.now()+6e4;RV.q.push(w)}
 else{c.r++;if(c.r===1)c.i=g===3?4:1;else if(c.r===2)c.i=g===1?2:g===3?6:3;else c.i=Math.max(1,Math.round(c.i*(g===1?1.2:c.e*(g===3?1.3:1))));if(g===3)c.e=Math.min(3,c.e+.15);c.d=Date.now()+c.i*864e5;RV.good++}
 m[w[0]]=c;srsSave(m);setP(w,g>=2);RV.done++;RV.i++;RV.rev=false;render()}
function srsView(){const w=RV.q[RV.i],m=srsMap(),dueLater=Object.keys(m).filter(k=>k[0]!=="_"&&m[k].d>Date.now()).length;
 if(!w)return `<div class="duo-card" style="text-align:center"><div style="font-size:44px">🎉</div><b style="font-size:20px">${RV.done?"Session complete!":"Nothing due right now"}</b><div class="hint" style="margin:8px 0">${RV.done?`${RV.done} reviews · ${Math.round(RV.good/Math.max(1,RV.done)*100)}% remembered`:"Come back later, or pick another level or category to add new words."}</div><div class="hint">${dueLater} words scheduled for later</div><div style="margin-top:12px"><button class="cat-chip on" onclick="srsStart();render()">Check again</button></div></div>`;
 const known=m[w[0]]&&m[w[0]].r>0,tot=RV.q.length;
 return `<div class="hint" style="margin-bottom:6px">${RV.i+1} / ${tot} · ${known?"🔁 Review":"✨ New word"}</div><div class="duo-prog"><i style="width:${RV.i/tot*100}%"></i></div>
 <div class="duo-card" style="text-align:center;cursor:pointer;margin-top:10px" onclick="if(!RV.rev){RV.rev=true;speak('${esc(w[0]).replace(/'/g,"")}',0.9);render()}">
 <div class="hint">${esc(getActivePair().srcName)}</div><div style="font-size:28px;font-weight:800;margin:8px 0">${esc(w[2])}</div>
 ${RV.rev?`<div style="border-top:1.5px solid var(--surf-2);padding-top:10px"><div style="font-size:30px;font-weight:800;color:var(--ac)">${esc(w[0])}</div>${w[1]?`<div class="hint">/${esc(w[1])}/</div>`:""}</div>`:`<div class="hint">Try to recall it, then tap to reveal</div>`}</div>
 ${RV.rev?`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px">${[["Again","1 min"],["Hard","soon"],["Good","later"],["Easy","long"]].map((x,g)=>`<button class="cat-chip ${g===2?"on":""}" style="justify-content:center;padding:12px 4px;flex-direction:column" onclick="srsGrade(${g})">${x[0]}<small style="opacity:.7">${x[1]}</small></button>`).join("")}</div>`:""}`}
/* Sentence builder */
function sbNew(){const ls=SC.flatMap(s=>s.L).filter(l=>l[0]&&l[0].split(/\s+/).length>=3&&l[0].split(/\s+/).length<=9);if(!ls.length){RV.sb=null;return}
 const l=sh(ls)[0],t=l[0].split(/\s+/);RV.sb={tr:l[1],t,bank:sh(t.map((x,i)=>i)),ans:[],ok:null}}
function sbTap(i,fromAns){const b=RV.sb;if(b.ok!==null)return;if(fromAns){b.ans.splice(b.ans.indexOf(i),1);b.bank.push(i)}else{b.bank.splice(b.bank.indexOf(i),1);b.ans.push(i)}
 if(!b.bank.length){b.ok=norm(b.ans.map(k=>b.t[k]).join(" "))===norm(b.t.join(" "));if(b.ok){xp(3);RV.sbs++;speak(b.t.join(" "),0.9)}}render()}
function sbView(){const b=RV.sb;if(!b)return `<div class="duo-card"><div class="hint">No sentences available for this language pair yet. Open the Guide tab first.</div></div>`;
 const chip=(i,f)=>`<button class="cat-chip" style="font-size:16px;padding:10px 12px" onclick="sbTap(${i},${f})">${esc(b.t[i])}</button>`;
 return `<div class="hint">Streak of correct sentences: ${RV.sbs} 🔥</div><div class="duo-card" style="margin-top:8px"><div class="hint">Build this sentence:</div><div style="font-size:20px;font-weight:800;margin:6px 0 12px">${esc(b.tr)}</div>
 <div style="min-height:56px;display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:2px dashed var(--bd);border-radius:14px;${b.ok===true?"border-color:#16a34a;background:#f0fdf4":b.ok===false?"border-color:var(--ac)":""}">${b.ans.map(i=>chip(i,1)).join("")||'<span class="hint">Tap the words in order</span>'}</div>
 ${b.ok===false?`<div class="hint" style="margin-top:8px;color:var(--ac)">Not quite. Correct: <b>${esc(b.t.join(" "))}</b></div>`:""}${b.ok===true?`<div class="hint" style="margin-top:8px;color:#16a34a"><b>Perfect! +3 XP</b></div>`:""}
 <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">${b.bank.map(i=>chip(i,0)).join("")}</div></div>
 <div style="margin-top:12px;display:flex;gap:8px">${b.ok!==null?`<button class="cat-chip on" onclick="if(RV.sb.ok===false)RV.sbs=0;sbNew();render()">Next →</button>`:`<button class="cat-chip" onclick="RV.sb.bank=sh(RV.sb.t.map((x,i)=>i));RV.sb.ans=[];render()">Reset</button>`}<button class="cat-chip" onclick="speak(RV.sb.t.join(' '),0.9)">🔊 Hear it</button></div>`}
/* Speaking practice */
function spNew(){const p=P();RV.sp=p.length?sh(p)[0]:null;RV.spMsg=""}
function spSay(){const SRc=window.SpeechRecognition||window.webkitSpeechRecognition,w=RV.sp;if(!SRc){RV.spMsg="Speech recognition is not available here. Try Safari or Chrome.";return render()}
 const r=new SRc();r.lang=getActivePair().tgtCode||"pl-PL";r.interimResults=false;r.maxAlternatives=1;RV.spMsg="🎤 Listening…";render();
 r.onresult=e=>{const t=e.results[0][0].transcript,a=norm(t),b=norm(w[0]),sc=Math.max(0,Math.round((1-lev(a,b)/Math.max(a.length,b.length,1))*100));
  RV.spMsg=sc>=80?`✅ ${sc}% Great pronunciation! I heard “${esc(t)}”. +2 XP`:`🔁 ${sc}%. I heard “${esc(t)}”. Listen again and retry.`;if(sc>=80)xp(2);render()};
 r.onerror=()=>{RV.spMsg="Could not hear you. Check the microphone permission and try again.";render()};r.start()}
function spView(){const w=RV.sp;if(!w)return `<div class="duo-card"><div class="hint">No words available.</div></div>`;
 return `<div class="duo-card" style="text-align:center"><div class="hint">Say this ${esc(getActivePair().tgtName)} word aloud</div><div style="font-size:34px;font-weight:800;color:var(--ac);margin:8px 0">${esc(w[0])}</div>${w[1]?`<div class="hint">/${esc(w[1])}/</div>`:""}<div style="font-size:18px;margin:6px 0">${esc(w[2])}</div><div style="margin:14px 0 6px;min-height:22px;font-weight:700">${RV.spMsg}</div>
 <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="cat-chip" onclick="speak('${esc(w[0]).replace(/'/g,"")}',0.8)">🔊 Listen</button><button class="cat-chip on" onclick="spSay()">🎤 Say it</button><button class="cat-chip" onclick="spNew();render()">Next word →</button></div></div>`}
function srs(m){
 if(RV.t==="sb"&&!RV.sb)sbNew();if(RV.t==="sp"&&!RV.sp)spNew();
 const mp=srsMap(),dueN=Object.keys(mp).filter(k=>k[0]!=="_"&&mp[k].d<=Date.now()).length;
 m.innerHTML=`<div class="cats"><button class="cat-chip ${RV.t==="srs"?"on":""}" onclick="RV.t='srs';srsStart();render()">🔁 Smart Review${dueN?` (${dueN})`:""}</button><button class="cat-chip ${RV.t==="sb"?"on":""}" onclick="RV.t='sb';sbNew();render()">🧩 Sentences</button><button class="cat-chip ${RV.t==="sp"?"on":""}" onclick="RV.t='sp';spNew();render()">🎤 Speak</button></div>`+(RV.t==="srs"?srsView():RV.t==="sb"?sbView():spView())}
